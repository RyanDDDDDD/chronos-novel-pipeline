[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos"
version = "3.1.0"
description = "A local-first, multi-agent long-form narrative engine."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "RyanDDDDDD" }
]
keywords = ["novel-generation", "multi-agent", "sandbox", "long-form-fiction"]
dependencies = [
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "loguru>=0.7.3",
    "websockets>=16.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.46.0",
    "fastembed>=0.8.0",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.2,<2",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20",
    "psutil>=6.0.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.28",
    "pyahocorasick>=2.1.0",
    "pillow>=10.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
app = ["rich", "textual"]
release = ["pyinstaller>=6.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-testmon>=2.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "src/backend"]
asyncio_mode = "auto"
markers = [
    "slow: hits live Chroma index / embedding model (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/backend/engine/execution/execution_manager.py" = ["E402", "I001"]
"src/backend/engine/execution/refine_manager.py" = ["E402", "I001"]
"src/backend/context/indexers/__init__.py" = ["E402", "I001"]
"src/backend/context/indexers/lore_indexer.py" = ["E402", "I001"]
"src/backend/context/providers/plot_outline_provider.py" = ["E402", "I001"]
"src/backend/context/providers/character_archive_provider.py" = ["I001"]
"src/backend/context/context_registry.py" = ["E402", "I001", "B905", "B007"]
"src/backend/llm/llm_manager.py" = ["I001"]
"src/backend/shared/log.py" = ["I001"]
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
mypy_path = "src/backend"
explicit_package_bases = true
